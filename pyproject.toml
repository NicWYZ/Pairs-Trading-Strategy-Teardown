[project]
name = "pairs-teardown"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "yfinance>=0.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
    # Notebook execution. ipykernel must be declared here rather than installed on
    # demand: a uv-created venv has no `pip`, so VS Code's "Install ipykernel"
    # prompt has nothing to shell out to and always fails.
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pairs_teardown"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # third-party stubs (statsmodels, yfinance) are incomplete

[tool.pytest.ini_options]
testpaths = ["tests"]
