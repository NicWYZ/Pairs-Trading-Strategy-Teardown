name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pinned to the interpreter in uv.lock. Using `uv sync` (never
      # `uv pip install -e`) is the same rule the project follows locally, for
      # the same reason: pip can target a different Python than uv sync does.
      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Typecheck
        run: uv run mypy src

      # The suite is entirely synthetic — no network, no cached parquet — so it
      # runs identically on a clean CI box. Anything that needs market data
      # belongs in the notebooks, which CI deliberately does not execute.
      - name: Test
        run: uv run pytest -q
